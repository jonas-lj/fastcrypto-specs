# Which fastcrypto revision each contract was last checked against. See STYLE.md.
#
# Once checked, an entry reads:
#   [name]
#   fastcrypto = "<commit>"   # fastcrypto revision the check ran on
#   method = "<method>"       # test, llm-review, review, verus or aeneas
#   date = "<YYYY-MM-DD>"
#   pr = "<owner/repo#n>"     # optional: the PR, if the revision is not on main yet
# An empty entry has not been checked yet.

